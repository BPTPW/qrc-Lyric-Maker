<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QRC逐字歌词制作 / QRC Lyric Maker</title>
<script>
    let nowItem = 0
    let startTime = 0;
    let currentLanguage = 'zh'; // 'zh' for Chinese, 'en' for English

    const translations = {
        zh: {
            title: 'qrc逐字歌词制作',
            enterLyrics: '输入歌词：',
            generateList: '生成列表',
            nextChar: '下一个字',
            prevChar: '上一个字',
            break: '中断',
            showTime: '显示时间',
            detectKeyboard: '监测键盘',
            playbackSpeed: '倍速播放',
            browseFile: '选择音频文件'
        },
        en: {
            title: 'QRC Character-by-Character Lyric Maker',
            enterLyrics: 'Enter lyrics:',
            generateList: 'Generate List',
            nextChar: 'Next Character',
            prevChar: 'Previous Character',
            break: 'Break',
            showTime: 'Show Time',
            detectKeyboard: 'Detect Keyboard',
            playbackSpeed: 'Playback Speed',
            browseFile: 'Select Audio File'
        }
    };

    function setLanguage(lang) {
        currentLanguage = lang;
        localStorage.setItem('lyricMakerLanguage', lang);
        updateUIText();
    }

    function updateUIText() {
        const t = translations[currentLanguage];
        
        document.title = t.title;
        document.getElementById('enterLyricsLabel').textContent = t.enterLyrics;
        document.getElementById('generateListBtn').textContent = t.generateList;
        document.getElementById('nextBtn').textContent = t.nextChar;
        document.getElementById('prevBtn').textContent = t.prevChar;
        document.getElementById('breakBtn').textContent = t.break;
        document.getElementById('displayTimeLabel').textContent = t.showTime;
        document.getElementById('listenKeyLabel').textContent = t.detectKeyboard;
        document.getElementById('playbackSpeedLabel').textContent = t.playbackSpeed;
        document.getElementById('fileLabel').textContent = t.browseFile;

        // Update language selector
        document.getElementById('langSelector').value = currentLanguage;
    }

    function split(){
        nowItem = 0
        
        document.getElementById('lrcList').innerHTML = ''
        
        let text = document.getElementById('lrcText').value

        let line = text.split(/[\n]/)

        for(let j=0;j<line.length;j++){
        let nowLine = line[j]

        let lineTmp = new Array()
        let enTmp = null;
                
        addText(true,null)
                
        for(let i=0;i<nowLine.length;i++){
            let nowText = nowLine.substr(i,1)
                    
                if(nowText.charCodeAt()>=32 && nowText.charCodeAt()<=125){
                    if(enTmp == null){
                        enTmp = nowText
                    }else{
                        enTmp = enTmp + nowText
                    }
                    if(nowText == ' '){
                        lineTmp.push(enTmp)
                        addText(false,enTmp)
                        enTmp = null
                    }
                }else{
                    if(enTmp!=null){
                        lineTmp.push(enTmp)
                        addText(false,enTmp)
                        enTmp = null
                    }
                    lineTmp.push(nowText)
                    addText(false,nowText)
                }
            }
            if(enTmp != null){
                lineTmp.push(enTmp)
                addText(false,enTmp)
            }
            //console.log(lineTmp)
        }
    }
    
    function addText(lineStart,text){
        let lrcList = document.getElementById('lrcList')
        let ele = document.createElement('a')
        let timeEle = document.createElement('a')
        
        ele.innerHTML = text
        
        if(lineStart){
            let br = document.createElement('br')
            lrcList.appendChild(br)
            
            timeEle.name = 'lineStart'
        }
        
        ele.className = 'aLyric'
        timeEle.className = 'tLyric'
        
        lrcList.appendChild(ele)
        lrcList.appendChild(timeEle)
    }
    
    function onInputFileChange() {  
       let file = document.getElementById('file').files[0];  
       let url = URL.createObjectURL(file);
       document.getElementById("musicPlayer").src = url;  
    }
    
    function next(){
        let audio = document.getElementById('musicPlayer')
        
        let timeMs = (audio.currentTime * 1000).toFixed(0)
        
        //1都是上一个，2是接下来的
        let text1 = document.getElementsByClassName('aLyric')[nowItem]
        let text2 = null;
        if(nowItem + 1 < document.getElementsByClassName('aLyric').length){
            text2 = document.getElementsByClassName('aLyric')[nowItem + 1]
        }
        
        let item1 = document.getElementsByClassName('tLyric')[nowItem]
        let item2 = null;
        if(nowItem + 1 < document.getElementsByClassName('tLyric').length){
            item2 = document.getElementsByClassName('tLyric')[nowItem + 1]
        }
        
        if(item1.name == 'lineStart'){
            //item1.innerHTML = '[' + timeMs + ',0]' + item1.innerHTML
        }else{
            if(!item1.innerHTML.includes(')')){
                item1.innerHTML = item1.innerHTML + (timeMs-startTime) + ")"
            }
        }
        text1.style.backgroundColor = '#FFFFFF'
        text1.style.color = '#FF0000'
        
        if(item2!=null){
            if(item2.name != 'lineStart'){
                item2.innerHTML = "(" + timeMs + ","
                text2.style.backgroundColor = '#f3e715'
            }
        }
        
        nowItem++
        startTime = timeMs
        if(item2.name == 'lineStart') next()
        
        setLineStart()
    }
    
    function last(){
        let audio = document.getElementById('musicPlayer')
        
        //1是现在的，2是要切换到的上一个
        let text1 = document.getElementsByClassName('aLyric')[nowItem]
        let text2 = null;
        if(nowItem + 1 < document.getElementsByClassName('aLyric').length){
            text2 = document.getElementsByClassName('aLyric')[nowItem - 1]
        }
        
        let item1 = document.getElementsByClassName('tLyric')[nowItem]
        if(nowItem + 1 < document.getElementsByClassName('tLyric').length){
            let item2 = document.getElementsByClassName('tLyric')[nowItem - 1]
            
            let lastTime = item2.innerHTML.substring(1,item2.innerHTML.indexOf(','))
            audio.currentTime = (lastTime-2000)/1000
            
            if(item2.name != 'lineStart')
                item2.innerHTML = "(" + lastTime + ","
            
            text1.style.backgroundColor = '#FFFFFF'
            text2.style.color = '#000000'
            text2.style.backgroundColor = '#f3e715'
            
            nowItem--
            startTime = lastTime
            if(item2.name == 'lineStart') last()
        }
        
        setLineStart()
    }
    
    function cut(){
        let audio = document.getElementById('musicPlayer')
        
        let timeMs = (audio.currentTime * 1000).toFixed(0)
        
        let text1 = document.getElementsByClassName('aLyric')[nowItem]
        
        let item1 = document.getElementsByClassName('tLyric')[nowItem]
        
        if(item1.name == 'lineStart'){
            item1.innerHTML = '[' + timeMs + ',0]'
        }else{
            item1.innerHTML = item1.innerHTML + (timeMs-startTime) + ")"
        }
        text1.style.backgroundColor = '#FFFFFF'
        text1.style.color = '#FF0000'
        
        setLineStart()
    }
    
    function displayTimeChange(){
        let tLryric = document.getElementsByClassName('tLyric')
        let display
        if(document.getElementById('displayTime').checked){
            display = 'inline-block'
        }else{
            display = 'none'
        }
        for(let i=0;i<tLryric.length;i++){
            tLryric[i].style.display = display
        }
        
        setLineStart()
    }
    
    function speedChange(){
        document.getElementById('musicPlayer').playbackRate = document.getElementById('speed').value
    }
    
    function setLineStart(){
        let tLryric = document.getElementsByClassName('tLyric')
        for(let i=0;i<tLryric.length;i++){
            if(tLryric[i].name == 'lineStart'){
                if(tLryric.length > i+1){
                    let time = tLryric[i+1].innerHTML.substring(1,tLryric[i+1].innerHTML.indexOf(','))
                    if(time == ''){
                        tLryric[i].innerHTML = '[0,0]'
                    }else{
                        tLryric[i].innerHTML = '[' + time + ',0]'
                    }
                }
            }
        }
    }

    window.onload = function() {
        const savedLanguage = localStorage.getItem('lyricMakerLanguage') || 'zh';
        setLanguage(savedLanguage);
    }
    
	</script>
    <script>
        document.onkeydown = function(eve){
            keyCode = eve.keyCode || eve.which
            
            console.log(keyCode)
            
            if(document.getElementById('listenKey').checked){
                //S
                if(keyCode == 83){
                    next()
                }
                //W
                if(keyCode == 87){
                    last()
                }
                //D
                if(keyCode == 68){
                    cut()
                }
                //Q
                if(keyCode == 81){
                    document.getElementById('speed').value = (document.getElementById('speed').value - 0.1).toFixed(2)
                    speedChange()
                }
                //E
                if(keyCode == 69){
                    document.getElementById('speed').value = (Number(document.getElementById('speed').value) + 0.1).toFixed(2)
                    speedChange()
                }
                //空格
                if(keyCode == 32){
                    if(document.getElementById('musicPlayer').paused == true){
                        document.getElementById('musicPlayer').play()
                    }else{
                        document.getElementById('musicPlayer').pause()
                    }
                    
                }
            }
            
        }
    </script>
    <style>
        .language-selector {
            position: fixed;
            top: 10px;
            right: 10px;
            z-index: 1000;
            padding: 8px 12px;
            border-radius: 4px;
            border: 1px solid #ccc;
            background-color: #fff;
            font-size: 14px;
            cursor: pointer;
        }
        .float{
            position: fixed;
            bottom: 0px;
            left: 0px;
            background: #EBEBEB;
            width: 100%;
            padding-top: 5px;
            padding-bottom: 5px;
        }
        .tLyric{
            display: none;
        }
        #musicPlayer{
            width: 100%;
            height: 30px;
        }
        #lrcText{
            width: 100%;
            height: 50%;
        }
        #lrcList{
            margin-bottom: 50%;
        }
    </style>
</head>
<body>
    <select id="langSelector" class="language-selector" onChange="setLanguage(this.value)">
        <option value="zh">中文</option>
        <option value="en">English</option>
    </select>

    <p id="enterLyricsLabel">输入歌词：</p>
    <textarea id="lrcText"></textarea>
    <br>
    <button id="generateListBtn" onClick="split()">生成列表</button>
    <br><br>
    <div id="lrcList"></div>
    
    <div class="float">
        <label id="fileLabel">选择音频文件</label>
        <input type="file" onChange="onInputFileChange()" id="file">
        <button id="nextBtn" onClick="next()">下一个字</button>
        <button id="prevBtn" onClick="last()">上一个字</button>
        <button id="breakBtn" onClick="cut()">中断</button>
        <br>
        <input type="checkbox" id="displayTime" onChange="displayTimeChange()"><label id="displayTimeLabel" for="displayTime">显示时间</label>
        <input type="checkbox" id="listenKey"><label id="listenKeyLabel" for="listenKey">监测键盘</label>
        <label id="playbackSpeedLabel">倍速播放</label><input type="number" id="speed" value="1" onChange="speedChange()">
        <br>
        <audio controls id="musicPlayer"></audio>
    </div>
</body>
</html>
